name: Signaler une anomalie
description: Décrire une erreur reproductible dans Ech0 Vercel.
title: "[Anomalie] "
labels:
  - bug
body:
  - type: textarea
    id: description
    attributes:
      label: Anomalie
      description: Décrire le résultat observé et le résultat attendu.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Étapes de reproduction
      description: Ajouter les erreurs utiles en retirant les jetons et données personnelles. Utiliser le signalement privé pour les vulnérabilités.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version ou commit
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Mode d’exécution
      options:
        - Vercel
        - Binaire natif
        - Développement local
        - Autre
    validations:
      required: true
