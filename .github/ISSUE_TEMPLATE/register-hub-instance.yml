name: Ajouter une instance au Hub
description: Proposer une instance publique pour le registre du Hub.
title: "[Hub] Ajouter une instance"
labels:
  - hub
body:
  - type: markdown
    attributes:
      value: |
        L’instance doit être accessible publiquement, utiliser Ech0 4.4.0 ou une version ultérieure et autoriser l’origine du Hub dans sa configuration CORS. Le formulaire prépare une modification du registre pour revue.
  - type: input
    id: instance_id
    attributes:
      label: Identifiant de l’instance
      description: Identifiant unique avec des lettres minuscules, des chiffres et des tirets.
      placeholder: mon-ech0
    validations:
      required: true
  - type: input
    id: instance_url
    attributes:
      label: URL de l’instance
      placeholder: https://ech0.example.org
    validations:
      required: true
