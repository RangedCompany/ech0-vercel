name: Proposer une amélioration
description: Décrire un besoin pour Ech0 Vercel.
title: "[Amélioration] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Besoin
      description: Quel problème se pose et qui est concerné ?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposition
      description: Décrire le résultat attendu et les contraintes.
    validations:
      required: true
